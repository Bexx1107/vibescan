<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeScan admin</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --ink: #e6e9ef; --dim: #8b93a4; --accent: #7cc4ff;
    --warn: #ffb454; --bad: #ff6b6b; --good: #4ade80;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 var(--mono);
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 5;
  }
  h1 { font-size: 14px; margin: 0; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
  nav button {
    background: transparent; color: var(--dim); border: 1px solid transparent;
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  nav button:hover { color: var(--ink); border-color: var(--line); }
  nav button[aria-current="true"] { color: var(--accent); border-color: var(--line); background: var(--panel); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card .k { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .card .v { font-size: 22px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--dim); }
  .tag.pending { color: var(--warn); border-color: var(--warn); }
  .tag.removed { color: var(--bad); border-color: var(--bad); }
  .tag.verified, .tag.claimed { color: var(--good); border-color: var(--good); }
  .tag.disputed { color: var(--warn); border-color: var(--warn); }
  button.act {
    background: transparent; color: var(--ink); border: 1px solid var(--line);
    padding: 4px 9px; border-radius: 5px; cursor: pointer; font: inherit; font-size: 12px;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
  .muted { color: var(--dim); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], input[type=password] {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    padding: 8px 10px; border-radius: 6px; font: inherit; width: 100%; max-width: 420px;
  }
  .gate { max-width: 460px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px; }
  .gate h2 { margin: 0 0 6px; font-size: 16px; }
  .gate p { color: var(--dim); margin: 0 0 16px; font-size: 12px; }
  .empty { color: var(--dim); padding: 20px; text-align: center; }
  details pre { white-space: pre-wrap; color: var(--dim); font-size: 12px; margin: 6px 0 0; }
  .err { color: var(--bad); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <h2>VibeScan admin</h2>
  <p>Tailnet only. Paste the admin token — it stays in this tab (sessionStorage), never in a cookie.</p>
  <input type="password" id="tokenInput" placeholder="ADMIN_TOKEN" autocomplete="off" autofocus>
  <div class="row" style="margin-top:12px">
    <button class="act" id="unlock">Unlock</button>
    <span class="muted" id="gateMsg"></span>
  </div>
  <div class="err" id="gateErr"></div>
</div>

<div id="app" hidden>
  <header>
    <h1>VibeScan admin</h1>
    <nav id="nav"></nav>
  </header>
  <main id="view"></main>
</div>

<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'vs.admin.token';
  var token = sessionStorage.getItem(TOKEN_KEY) || '';
  var view = 'overview';

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { Authorization: 'Bearer ' + token };
    if (opts.body) headers['Content-Type'] = 'application/json';
    return fetch(path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      if (r.status === 401) { lock(); throw new Error('unauthorized'); }
      return r.json().then(function (d) {
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  function lock() {
    token = '';
    sessionStorage.removeItem(TOKEN_KEY);
    $('#app').hidden = true;
    $('#gate').hidden = false;
  }

  function tag(v) { return el('span', 'tag ' + v, v); }

  /* ---------------- views ---------------- */

  var VIEWS = {
    overview: { label: 'Overview', render: renderOverview },
    removals: { label: 'Removals', render: renderRemovals },
    claims: { label: 'Claims', render: renderClaims },
    disputed: { label: 'Disputed', render: renderDisputed },
    sites: { label: 'Sites', render: renderSites },
    audit: { label: 'Audit', render: renderAudit }
  };

  function nav() {
    var n = $('#nav');
    n.textContent = '';
    Object.keys(VIEWS).forEach(function (k) {
      var b = el('button', null, VIEWS[k].label);
      if (k === view) b.setAttribute('aria-current', 'true');
      b.onclick = function () { view = k; nav(); VIEWS[k].render(); };
      n.appendChild(b);
    });
    var out = el('button', null, 'Lock');
    out.onclick = lock;
    n.appendChild(out);
  }

  function table(cols, rows, rowFn) {
    if (!rows.length) return el('div', 'empty', 'Nothing here.');
    var t = el('table');
    var thead = el('thead');
    var tr = el('tr');
    cols.forEach(function (c) { tr.appendChild(el('th', null, c)); });
    thead.appendChild(tr);
    t.appendChild(thead);
    var tb = el('tbody');
    rows.forEach(function (r) { tb.appendChild(rowFn(r)); });
    t.appendChild(tb);
    return t;
  }

  function renderOverview() {
    var v = $('#view');
    v.textContent = 'loading…';
    api('/api/admin/overview').then(function (d) {
      v.textContent = '';
      var cards = el('div', 'cards');
      [
        ['listed', d.sites.listed], ['claimed', d.sites.claimed],
        ['hidden', d.sites.hidden], ['removed', d.sites.removed],
        ['scans', d.scans], ['submissions', d.submissions],
        ['removals pending', d.pendingRemovals], ['claims pending', d.pendingClaims],
        ['disputed', d.disputed]
      ].forEach(function (p) {
        var c = el('div', 'card');
        c.appendChild(el('div', 'k', p[0]));
        c.appendChild(el('div', 'v', String(p[1])));
        cards.appendChild(c);
      });
      v.appendChild(cards);
      if (d.pendingRemovals) {
        var note = el('p', 'muted', 'There are removal requests waiting. Removals are honoured unconditionally — see the Removals tab.');
        v.appendChild(note);
      }
    }).catch(fail);
  }

  function renderRemovals() {
    var v = $('#view');
    v.textContent = 'loading…';
    api('/api/admin/removals?status=pending').then(function (d) {
      v.textContent = '';
      v.appendChild(table(
        ['When', 'Host', 'Site', 'Reason', 'Request', ''],
        d.rows,
        function (r) {
          var tr = el('tr');
          tr.appendChild(el('td', 'muted', new Date(r.created_at).toLocaleString()));
          tr.appendChild(el('td', null, r.host));
          var s = el('td'); s.appendChild(tag(r.site_status)); tr.appendChild(s);
          tr.appendChild(el('td', 'muted', r.reason || '—'));
          var st = el('td'); st.appendChild(tag(r.status)); tr.appendChild(st);
          var a = el('td');
          var row = el('div', 'row');
          var ok = el('button', 'act danger', 'Remove');
          ok.onclick = function () {
            if (!confirm('Remove ' + r.host + ' from the leaderboard?\nThis is immediate and honoured unconditionally.')) return;
            api('/api/admin/removal/' + r.id, { method: 'POST', body: { decision: 'approved' } })
              .then(renderRemovals).catch(fail);
          };
          var no = el('button', 'act', 'Reject');
          no.onclick = function () {
            api('/api/admin/removal/' + r.id, { method: 'POST', body: { decision: 'rejected' } })
              .then(renderRemovals).catch(fail);
          };
          row.appendChild(ok); row.appendChild(no);
          a.appendChild(row);
          tr.appendChild(a);
          return tr;
        }
      ));
    }).catch(fail);
  }

  function renderClaims() {
    var v = $('#view');
    v.textContent = 'loading…';
    api('/api/admin/claims').then(function (d) {
      v.textContent = '';
      v.appendChild(table(
        ['When', 'Host', 'Method', 'Status', ''],
        d.rows,
        function (r) {
          var tr = el('tr');
          tr.appendChild(el('td', 'muted', new Date(r.created_at).toLocaleString()));
          tr.appendChild(el('td', null, r.host));
          tr.appendChild(el('td', 'muted', r.method || '—'));
          var st = el('td'); st.appendChild(tag(r.status)); tr.appendChild(st);
          var a = el('td');
          if (r.status === 'pending') {
            var row = el('div', 'row');
            var ok = el('button', 'act', 'Mark verified');
            ok.onclick = function () {
              api('/api/admin/claim/' + r.id, { method: 'POST', body: { decision: 'verified' } })
                .then(renderClaims).catch(fail);
            };
            var no = el('button', 'act', 'Reject');
            no.onclick = function () {
              api('/api/admin/claim/' + r.id, { method: 'POST', body: { decision: 'rejected' } })
                .then(renderClaims).catch(fail);
            };
            row.appendChild(ok); row.appendChild(no);
            a.appendChild(row);
          } else {
            a.className = 'muted';
            a.textContent = '—';
          }
          tr.appendChild(a);
          return tr;
        }
      ));
    }).catch(fail);
  }

  function renderDisputed() {
    var v = $('#view');
    v.textContent = 'loading…';
    api('/api/admin/disputed').then(function (d) {
      v.textContent = '';
      v.appendChild(table(
        ['When', 'Host', 'Claimed', 'Builder', 'Platform', 'Confidence', 'Evidence'],
        d.rows,
        function (r) {
          var tr = el('tr');
          tr.appendChild(el('td', 'muted', new Date(r.created_at).toLocaleString()));
          tr.appendChild(el('td', null, r.host));
          var k = el('td'); k.appendChild(tag(r.builder_kind)); tr.appendChild(k);
          tr.appendChild(el('td', null, r.builder_name || '—'));
          tr.appendChild(el('td', 'muted', r.platform || '—'));
          tr.appendChild(el('td', 'num', String(r.confidence == null ? '—' : r.confidence)));
          var e = el('td');
          if (r.evidence && r.evidence.length) {
            var det = el('details');
            det.appendChild(el('summary', 'muted', r.evidence.length + ' signal(s)'));
            det.appendChild(el('pre', null, JSON.stringify(r.evidence, null, 2)));
            e.appendChild(det);
          } else {
            e.className = 'muted';
            e.textContent = '—';
          }
          tr.appendChild(e);
          return tr;
        }
      ));
    }).catch(fail);
  }

  function renderSites() {
    var v = $('#view');
    v.textContent = '';
    var bar = el('div', 'row');
    bar.style.marginBottom = '12px';
    var q = el('input');
    q.type = 'text';
    q.placeholder = 'filter host…';
    var go = el('button', 'act', 'Search');
    bar.appendChild(q); bar.appendChild(go);
    v.appendChild(bar);

    var host = el('div');
    v.appendChild(host);

    function load() {
      host.textContent = 'loading…';
      api('/api/admin/sites' + (q.value.trim() ? '?q=' + encodeURIComponent(q.value.trim()) : ''))
        .then(function (d) {
          host.textContent = '';
          host.appendChild(table(
            ['Host', 'Score', 'Status', 'Last scan', ''],
            d.rows,
            function (r) {
              var tr = el('tr');
              tr.appendChild(el('td', null, r.host));
              tr.appendChild(el('td', 'num', r.score == null ? '—' : String(r.score) + ' ' + (r.grade || '')));
              var st = el('td'); st.appendChild(tag(r.status)); tr.appendChild(st);
              tr.appendChild(el('td', 'muted', r.scanned_at ? new Date(r.scanned_at).toLocaleString() : '—'));
              var a = el('td');
              var row = el('div', 'row');
              ['listed', 'hidden', 'removed'].forEach(function (s) {
                if (s === r.status) return;
                var b = el('button', 'act' + (s === 'removed' ? ' danger' : ''), s);
                b.onclick = function () {
                  api('/api/admin/site', { method: 'POST', body: { host: r.host, status: s } })
                    .then(load).catch(fail);
                };
                row.appendChild(b);
              });
              a.appendChild(row);
              tr.appendChild(a);
              return tr;
            }
          ));
        }).catch(fail);
    }
    go.onclick = load;
    q.onkeydown = function (e) { if (e.key === 'Enter') load(); };
    load();
  }

  function renderAudit() {
    var v = $('#view');
    v.textContent = 'loading…';
    api('/api/admin/audit').then(function (d) {
      v.textContent = '';
      v.appendChild(table(
        ['When', 'Action', 'Subject', 'Detail', 'From'],
        d.rows,
        function (r) {
          var tr = el('tr');
          tr.appendChild(el('td', 'muted', new Date(r.at).toLocaleString()));
          tr.appendChild(el('td', null, r.action));
          tr.appendChild(el('td', null, r.subject || '—'));
          tr.appendChild(el('td', 'muted', r.detail || '—'));
          tr.appendChild(el('td', 'muted', r.ip_hash || '—'));
          return tr;
        }
      ));
    }).catch(fail);
  }

  function fail(err) {
    var v = $('#view');
    v.textContent = '';
    var e = el('div', 'err', err && err.message ? err.message : 'request failed');
    v.appendChild(e);
  }

  /* ---------------- boot ---------------- */

  $('#unlock').onclick = function () {
    var t = $('#tokenInput').value.trim();
    if (!t) return;
    token = t;
    api('/api/admin/overview')
      .then(function () {
        sessionStorage.setItem(TOKEN_KEY, token);
        $('#gateErr').textContent = '';
        $('#gate').hidden = true;
        $('#app').hidden = false;
        nav();
        VIEWS[view].render();
      })
      .catch(function () {
        token = '';
        $('#gateErr').textContent = 'Rejected. Check the token.';
      });
  };
  $('#tokenInput').onkeydown = function (e) {
    if (e.key === 'Enter') $('#unlock').click();
  };

  if (token) {
    api('/api/admin/overview')
      .then(function () {
        $('#gate').hidden = true;
        $('#app').hidden = false;
        nav();
        VIEWS[view].render();
      })
      .catch(function () {
        lock();
      });
  }
})();
</script>
</body>
</html>
